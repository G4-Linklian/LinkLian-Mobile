name: LINKLIAN-MOBILE CI

on:
  push:
    branches: ["main", "staging"]
    paths:
      - "lib/**"
      - "test/**"
      - "android/**"
      - "ios/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - "go-ci.sh"
      - ".github/workflows/ci-mobile.yml"
  pull_request:
    branches: ["main", "staging"]
    paths:
      - "lib/**"
      - "test/**"
      - "android/**"
      - "ios/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - "go-ci.sh"
      - ".github/workflows/ci-mobile.yml"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.22.0"

jobs:
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  format:
    name: Format (dart format)
    runs-on: ubuntu-latest
    needs: [secret-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Run format
        shell: bash
        run: bash ./go-ci.sh format

  analyze:
    name: Analyze (flutter analyze)
    runs-on: ubuntu-latest
    needs: [format]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Run analyze
        shell: bash
        run: bash ./go-ci.sh analyze

  unit-test:
    name: Unit Test + Coverage
    runs-on: ubuntu-latest
    needs: [analyze]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Run tests
        shell: bash
        run: bash ./go-ci.sh test

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage
          path: coverage
          if-no-files-found: warn
          retention-days: 7

  sca:
    name: SCA (pub deps/outdated/audit)
    runs-on: ubuntu-latest
    needs: [analyze]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Run SCA
        shell: bash
        run: bash ./go-ci.sh sca
